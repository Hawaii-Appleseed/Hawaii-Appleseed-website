<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hawaiʻi Appleseed Content Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Filters</h2>

      <div class="filter-group" id="filter-doctype">
        <h4>Document type</h4>
        <div class="filter-row">
          <label class="all-box"><input type="checkbox" class="all-toggle" checked /> All</label>
          <details>
            <summary>Choose specific</summary>
            <div class="options"></div>
          </details>
        </div>
      </div>

      <div class="filter-group" id="filter-topic">
        <h4>Subject Area</h4>
        <div class="filter-row">
          <label class="all-box"><input type="checkbox" class="all-toggle" checked /> All</label>
          <details>
            <summary>Choose specific</summary>
            <div class="options"></div>
          </details>
        </div>
      </div>

      <div class="filter-group" id="filter-stance">
        <h4>Position</h4>
        <div class="filter-row">
          <label class="all-box"><input type="checkbox" class="all-toggle" checked /> All</label>
          <details>
            <summary>Choose specific</summary>
            <div class="options"></div>
          </details>
        </div>
      </div>

      <div class="year-head">
        <h4>Published year</h4>
        <span class="range-val" id="year-val">2016–2026</span>
      </div>
      <div class="dual-range">
        <div class="track"><div class="fill" id="year-fill"></div></div>
        <input type="range" id="year-min" min="2016" max="2026" value="2016" step="1" aria-label="Earliest year" />
        <input type="range" id="year-max" min="2016" max="2026" value="2026" step="1" aria-label="Latest year" />
      </div>

      <hr />
      <div class="muted">Search engine</div>
      <label><input type="checkbox" id="use-bm25" checked /> Keyword match (BM25)</label>
      <label><input type="checkbox" id="use-rerank" checked /> Cross-encoder rerank</label>
      <hr />
      <div class="muted">All processing is local — query embedding and reranking run in your browser. Nothing is sent to a server.</div>
    </aside>

    <main class="main">
      <h1>Hawaiʻi Appleseed Content Search</h1>
      <input type="search" id="query" autocomplete="off"
        placeholder="e.g. conveyance tax marginal rates · HB2049 · universal school meals · empty homes tax" />
      <div class="model-status" id="model-status"></div>

      <div id="results"></div>
    </main>
  </div>

  <dialog id="source-modal">
    <button class="close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-content"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
