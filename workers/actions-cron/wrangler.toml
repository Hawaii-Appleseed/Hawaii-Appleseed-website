name = "ha-actions-cron"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Fires this repo's GitHub Actions workflows on time. GitHub drops most of the
# repo's own cron triggers: fetch-bill-status.yml asks for every 30 min and got
# 4-6 runs a day in Oct 2026. Cloudflare Cron Triggers are reliable, so this
# Worker calls workflow_dispatch on the same schedule. The workflows keep their
# own `schedule:` as a backup.
#
# Account: Devin@hibudget.org's Account (d844f7c81a9353ee3ba8b4386bf75b92),
# the same one that runs ha-ask.
account_id = "d844f7c81a9353ee3ba8b4386bf75b92"

# No HTTP surface at all: cron only.
workers_dev = false
preview_urls = false

[triggers]
crons = [
  "*/30 * * * *",  # fetch-bill-status.yml
  "20 * * * *",    # canary.yml (hourly, same minute as its own cron)
]

[observability]
enabled = true

# Secret (never in this file). A fine-grained GitHub token for the
# Hawaii-Appleseed/Hawaii-Appleseed-website repo only, permission
# "Actions: Read and write" and nothing else:
#   npx wrangler secret put GITHUB_TOKEN
