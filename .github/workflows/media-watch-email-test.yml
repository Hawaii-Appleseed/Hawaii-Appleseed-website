name: Media watch email test

# Sends one test email through the same Gmail login the approval flow uses, but
# only to the sending address itself, never to staff. Run it by hand from the
# Actions tab after changing the MEDIA_WATCH_GMAIL_* secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIL_USER: ${{ secrets.MEDIA_WATCH_GMAIL_USER }}
      MAIL_PASS: ${{ secrets.MEDIA_WATCH_GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets' shape (lengths only, never values)
        run: |
          python3 - <<'PY'
          import os, re
          u, p = os.environ["MAIL_USER"], os.environ["MAIL_PASS"]
          print("user: length", len(u), "| one @:", u.count("@") == 1, "| has whitespace:", bool(re.search(r"\s", u)))
          q = "".join(p.split())
          print("password: length", len(p), "| without spaces", len(q), "| letters only:", q.isalpha(), "| ascii:", q.isascii())
          PY
      - name: Send the test email to the sender only
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          me = os.environ["MAIL_USER"]
          m = EmailMessage()
          m["Subject"], m["From"], m["To"] = "Media watch email test", me, me
          m.set_content("The media watch Gmail login works. Approved stories will be emailed to staff from this address.")
          pw = "".join(os.environ["MAIL_PASS"].split())  # app passwords are shown with spaces
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as s:
              s.ehlo(); s.starttls(); s.ehlo()
              s.login(me.strip(), pw)
              s.send_message(m)
          print("test email sent")
          PY
