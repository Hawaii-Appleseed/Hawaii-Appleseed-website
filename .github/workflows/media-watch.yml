name: Media watch

# Finds news stories that mention Hawaiʻi Appleseed, its work, or its staff and
# are not on /in-the-news yet. What it searches, and why the outlet feeds are
# read in full as well as searched, is in scripts/media_watch.py's docstring and
# media-watch/config.json.
#
# Four times a day rather than once: the outlets' feeds hold only their latest
# 10-50 stories, so a busy newsroom scrolls a story off within hours. Each story
# is read once (media-watch/.cache/checked.json, kept in the Actions cache and
# not the repo), so the extra runs cost almost nothing. Quiet runs commit and
# notify nothing.
#
# The repo is public and Pages serves the whole tree, so mentions.json, the
# digest and the issue are all public. Only medium/high-confidence matches are
# ever written — see the docstring for why a bare staff name is not enough.

on:
  schedule:
    # 04:17 10:17 16:17 22:17 UTC = 6:17pm 12:17am 6:17am 12:17pm Hawaii (UTC-10)
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days (blank = config default; use 30 to backfill)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: media-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A warm run takes ~6 minutes. A cold one (empty cache: the first run, or after
    # GitHub evicts it) reads several hundred pages, ~15 minutes on a fast link.
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Google Alerts RSS links, one per line. A secret, not config.json: each
      # URL embeds the owner's Google account id and this repo is public.
      # OFF since 2026-10-24: Alerts hands over Facebook posts the runner cannot
      # open, and an alert match on an unread page was posted to Slack unchecked
      # (two false positives in two days). The secret is still set; to turn the
      # source back on, uncomment this line.
      # MEDIA_WATCH_ALERT_FEEDS: ${{ secrets.MEDIA_WATCH_ALERT_FEEDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the list of stories already read
        uses: actions/cache@v4
        with:
          path: media-watch/.cache
          key: media-watch-${{ github.run_id }}
          restore-keys: media-watch-

      - name: Self-test
        run: |
          python3 scripts/test_media_watch.py
          python3 scripts/test_media_watch_approve.py

      - name: Search and read
        id: watch
        env:
          DAYS: ${{ inputs.days }}
        run: python3 scripts/media_watch.py ${DAYS:+--days "$DAYS"}

      - name: Commit the new mentions
        if: steps.watch.outputs.changed == 'true'
        uses: ./.github/actions/commit-push
        with:
          paths: media-watch/mentions.json media-watch/latest.md
          message: "media-watch: update mentions (${{ steps.watch.outputs.new }} to review)"

      # The issue IS the email: GitHub mails everyone watching the repo when it
      # opens, and it is assigned to Devin so he gets it regardless. Nothing is
      # posted to Slack from here. Replying "post" to that email (or "post 2 3")
      # comments on the issue, and media-watch-approve.yml then posts the stories
      # to #communications. Until someone approves, Slack sees nothing.
      - name: Open an issue with the digest
        if: steps.watch.outputs.new != '0' && steps.watch.outputs.new != ''
        run: |
          gh label create media-watch --color 5F8575 \
            --description "New press mentions of Hawaiʻi Appleseed" 2>/dev/null || true
          {
            cat media-watch/latest.md
            printf '\n---\n**To send to #communications:** reply `post` to this email for every story above, '
            printf 'or `post 2 3` for just those (numbered in the order listed). Nothing is posted until you do.\n'
          } > issue-body.md
          title="Media watch: ${{ steps.watch.outputs.new }} new mention(s) — $(date -u +%F)"
          gh issue create --title "$title" --label media-watch --assignee dtomkatsu \
            --body-file issue-body.md \
            || gh issue create --title "$title" --label media-watch --body-file issue-body.md

      # Last on purpose. The steps above must run first so that what the
      # working stages found is committed and announced; only then does a stage
      # that answered nothing at all fail the job, which is what makes
      # triage.yml open an issue. Without this, every outlet blocking the
      # runner's IP would read as a quiet news day.
      - name: Fail if a source stage was dead
        if: steps.watch.outputs.dead != ''
        run: |
          echo "::error::no answer from any source in: ${{ steps.watch.outputs.dead }}"
          exit 1
