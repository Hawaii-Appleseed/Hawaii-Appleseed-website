name: Sync content from hiappleseed.org

on:
  schedule:
    # Runs every day at 10 PM UTC (12 PM Hawaii time; HST is UTC-10 year-round, no DST)
    - cron: "0 22 * * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch deploy.yml (see the deploy step below)

    steps:
      - uses: actions/checkout@v4

      - name: Fetch publications from Squarespace
        run: python3 scripts/sync-publications.py

      - name: Fetch blog posts and press mentions from Squarespace
        run: python3 scripts/sync-news.py

      # Both scripts unconditionally restamp lastSynced to "now", so a raw
      # `git diff` is never quiet — every run would look "changed" even when
      # Squarespace returned byte-identical content. Compare with lastSynced
      # stripped so a real content change is what actually gates commit +
      # deploy, not the clock.
      - name: Check for real content changes
        id: diff
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess

          def normalize(text):
              try:
                  data = json.loads(text)
              except ValueError:
                  return text
              data.pop("lastSynced", None)
              return json.dumps(data, sort_keys=True)

          changed = False
          for path in ("news.json", "publications.json"):
              old = subprocess.run(["git", "show", f"HEAD:{path}"],
                                    capture_output=True, text=True)
              old_text = old.stdout if old.returncode == 0 else ""
              with open(path) as f:
                  new_text = f.read()
              if normalize(old_text) != normalize(new_text):
                  changed = True
                  print(f"{path}: content changed")
              else:
                  print(f"{path}: unchanged (only lastSynced differs, if that)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          PYEOF

      - name: Commit and push
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json news.json
          git commit -m "sync: update content from hiappleseed.org"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Nothing to commit but the working tree still has the fresh
      # lastSynced-only rewrite from the fetch steps — leave the job's tree
      # clean rather than ending the run with an uncommitted diff.
      - name: Discard no-op rewrite
        if: steps.diff.outputs.changed == 'false'
        run: git checkout -- news.json publications.json

      # The push above is authored by GITHUB_TOKEN, and GitHub's recursion
      # guard means it does NOT fire deploy.yml's `on: push`. Without this
      # step the synced data lands in the repo but never reaches Pages — it
      # sits unpublished until some unrelated human push happens to deploy
      # it. The live Squarespace pages fetch news.json off Pages at runtime,
      # so that gap shows up as days-stale blog and press content.
      #
      # workflow_dispatch is a documented exception to the recursion guard,
      # so GITHUB_TOKEN can dispatch it directly — no PAT needed.
      - name: Deploy synced content to Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
