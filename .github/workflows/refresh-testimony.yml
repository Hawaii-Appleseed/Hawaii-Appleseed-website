name: Refresh testimony from Drive

# Brings new Hawaiʻi Appleseed testimony from the shared Drive into
# writing-bot/testimony/ (writing-bot/sync_testimony.py says what counts:
# our own, finished, on a bill; no samples, drafts, other groups' testimony
# or the Legislature's compiled packets). The companion of refresh-corpus.yml,
# which does the same for the public blog and publications.
#
# Incremental: writing-bot/content-monitor/testimony-drive.json records every
# Drive file already looked at, so a run reads only new or changed files.
#
# Needs the GOOGLE_DRIVE_TOKEN secret: an authorized-user JSON (refresh
# token) with the read-only Drive scope, made with
# writing-bot/tools/mint_drive_token.py. Without it the run says so and stops
# green, so a missing secret never looks like a failure of the corpus.
#
# As in refresh-corpus.yml, GITHUB_TOKEN pushes do not trigger other
# workflows, so this dispatches the search-bundle rebuild and the Q&A bot
# refresh itself.

on:
  schedule:
    # Sundays 15:30 UTC (5:30 AM Hawaiʻi), half an hour after refresh-corpus.yml.
    - cron: "30 15 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh-corpus # one corpus writer at a time, shared with refresh-corpus.yml
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch deploy-content-search.yml and chatbot-refresh.yml
    steps:
      - name: Check for the Drive credential
        id: cred
        env:
          TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GOOGLE_DRIVE_TOKEN is not set; testimony was not refreshed. See writing-bot/tools/mint_drive_token.py."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.cred.outputs.ok == 'true'
        run: pip install 'google-api-python-client==2.200.0' 'google-auth==2.57.0' 'pypdf==6.10.2' 'python-docx==1.1.2'

      - name: Test the rules
        if: steps.cred.outputs.ok == 'true'
        run: python -m unittest discover -s writing-bot/tests -p 'test_sync_testimony.py'

      - name: Sync from Drive
        id: sync
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
        run: |
          python writing-bot/sync_testimony.py | tee /tmp/sync.log
          new=$(grep -oE 'NEW_FILES=[0-9]+' /tmp/sync.log | tail -1 | cut -d= -f2)
          echo "new_files=${new:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "### Testimony refresh"
            echo ""
            echo "New testimony: **${new:-0}**"
            echo '```'
            grep -E '^  testimony/' /tmp/sync.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The record file changes on most runs (new non-testimony files seen), so
      # commit whenever git sees a change, but only fan out when testimony was added.
      - name: Commit
        id: commit
        if: steps.cred.outputs.ok == 'true'
        uses: ./.github/actions/commit-push
        with:
          paths: writing-bot/
          message: "corpus: ${{ steps.sync.outputs.new_files }} new testimony from the shared Drive"

      - name: Rebuild the search bundle and refresh the Q&A bot
        if: steps.commit.outputs.pushed == 'true' && steps.sync.outputs.new_files != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 15 # let the pushed commit become main's resolved head
          gh workflow run deploy-content-search.yml --ref main
          gh workflow run chatbot-refresh.yml --ref main
