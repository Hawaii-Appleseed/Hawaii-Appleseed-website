name: Build Content Search bundle

# Rebuilds the content-search data bundle from the writing-bot corpus and
# pushes it straight into staff-updates-internal (private, Cloudflare
# Access-gated) — the app moved off public GitHub Pages 2026-08-29 since
# nothing linked to or polled it there. See content-search/README.md in that
# repo for the full picture; this repo keeps only the corpus + build engine
# (writing-bot/).
#
# content-search/ is NOT checked out from this repo — it's checked out from
# staff-updates-internal instead, then symlinked into place, so every
# existing path in build_static.py / embed_corpus.mjs / run_all.mjs resolves
# straight into the hub checkout with zero script changes. index.html, css/,
# and README.md in the hub are hand-maintained there (hub nav integration)
# and this workflow never touches them — it only ever writes content-search/
# data/, api.json, and test/fixtures.json.
#
# The heavy steps (Chroma index + browser-parity q8 embedding, ~180 MB model
# download on a cold cache) only run when the corpus content actually
# changed; a run that produces a byte-identical bundle pushes nothing. Use
# the `force` input to rebuild embeddings without a content change (e.g.
# after a model/dtype bump).

on:
  push:
    branches: [main]
    paths:
      - "writing-bot/**"
      - ".github/workflows/deploy-content-search.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild + push even if content is unchanged"
        type: boolean
        default: false

concurrency:
  group: content-search-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repo (corpus + build engine)
        uses: actions/checkout@v4
        with:
          path: website

      - name: Checkout staff-updates-internal (publish target)
        uses: actions/checkout@v4
        with:
          repository: Hawaii-Appleseed/staff-updates-internal
          token: ${{ secrets.STAFF_UPDATES_TOKEN }}
          path: hub

      - name: Link content-search to the hub checkout
        run: ln -s "$(pwd)/hub/content-search" website/content-search

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install chromadb rank-bm25

      - name: Build index + export data bundle
        working-directory: website/writing-bot
        run: |
          python -c "import bot; bot.index_documents(force=True)"
          python tools/build_static.py --verify
          python eval/static_dump.py > ../content-search/test/fixtures.json

      # Diff against the hub's own HEAD (its last-published bundle) rather
      # than this repo's, since the bundle no longer lives here. fixtures.json
      # is deliberately excluded (same reason as before: its inputs come from
      # a freshly built Chroma HNSW index, nondeterministic in the candidate
      # tail — real-content runs refresh it anyway, others discard it).
      # embeddings.bin/meta aren't written yet at this point (embed_corpus
      # runs later, only if go=true), so they never appear in this diff.
      - name: Check for real content changes
        id: diff
        working-directory: hub
        run: |
          git add -A content-search/data
          if git diff --cached --quiet -- content-search/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no content changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- content-search/data
          fi
          git reset content-search/data >/dev/null

      - name: Decide whether to continue
        id: gate
        env:
          FORCED: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ] || [ "$FORCED" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"

      - name: Cache HuggingFace models
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-MiniLM-L6-v2-q8

      - name: Install Node deps
        if: steps.gate.outputs.go == 'true'
        working-directory: website/writing-bot/tools
        run: npm ci

      - name: Embed corpus q8 (retry on transient HF 429)
        if: steps.gate.outputs.go == 'true'
        working-directory: website/writing-bot/tools
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Embedding attempt $attempt…"
            if node embed_corpus.mjs; then exit 0; fi
            echo "attempt $attempt failed; backing off…"; sleep $((attempt * 20))
          done
          echo "embed_corpus failed after 5 attempts"; exit 1

      - name: Unit tests (parity gate)
        if: steps.gate.outputs.go == 'true'
        working-directory: website
        run: node content-search/test/run_all.mjs

      - name: Guard — no relationship-memory in bundle
        if: steps.gate.outputs.go == 'true'
        working-directory: website
        run: |
          if find content-search/data/corpus -path '*relationship-memory*' | grep -q .; then
            echo "relationship-memory leaked into bundle!"; exit 1
          fi
          if grep -l "relationship-memory/" content-search/data/chunks.json >/dev/null 2>&1; then
            echo "relationship-memory path in chunks.json!"; exit 1
          fi

      - name: Push bundle to staff-updates-internal
        if: steps.gate.outputs.go == 'true'
        working-directory: hub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content-search/data content-search/api.json content-search/test/fixtures.json
          if git diff --cached --quiet; then
            echo "nothing to commit (force run reproduced an identical bundle)"
          else
            git commit -m "content-search: rebuild data bundle"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                pushed=true
                break
              fi
              echo "push attempt $attempt failed; retrying"
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::could not push the rebuilt bundle after 3 attempts"
              exit 1
            fi
          fi
