name: Canary — scheduled workflow health

# Watches this repo's OTHER scheduled workflows for a silently dropped
# trigger. GitHub Actions occasionally fails to fire a cron trigger at all
# (see the 2026-08-26 incident on githubstatus.com) — when that happens no
# run is ever created, so there's nothing for GitHub's normal
# "scheduled workflow failed" email to attach to. This job runs on its own
# schedule and checks how long it's been since each watched workflow last
# ran, of any conclusion. If one's gone quiet, it opens (or updates) a
# single tracking issue and fails the job — a real failure here DOES fire
# GitHub's built-in notification, and the issue gives a persistent, visible
# marker independent of anyone's notification settings.
#
# Thresholds are calibrated off *observed* gaps on a normal day, not the
# cron's stated interval — fetch-bill-status.yml says "every 30 minutes"
# but real gaps of 50-82 min are routine even with no incident, so a naive
# 35-40 min threshold would alert constantly on nothing.
#
# Caveat this can't fully solve: if THIS workflow's own trigger gets
# dropped, nothing fires. No in-repo monitoring is immune to that failure
# mode without an external pinger (e.g. a third-party uptime check hitting
# a workflow_dispatch or a status endpoint) — out of scope for "lightweight."
#
# Second job: escalating a failure nobody got round to. triage.yml alerts
# once, the moment a watched workflow fails, and then goes quiet. That is the
# right behaviour for a notification and the wrong behaviour for a fault that
# stays unfixed — deploy-content-search.yml broke on 2026-08-29, triage opened
# issue #6 within a second with the exact cause in it, and the content-search
# corpus then sat 8 days stale because a single Friday-evening alert is easy to
# miss. Nothing was watching for "still broken", because that workflow is
# push-triggered, so the freshness check above can't see it either.

on:
  schedule:
    - cron: "20 * * * *" # hourly, offset from the top of the hour
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification and report the topic fingerprint"
        type: boolean
        default: false

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # An honest way to answer "is the alerting channel actually working",
      # without faking a failure to find out. Everything else here only pushes
      # when something is wrong, which is exactly when you don't want to be
      # debugging the notifier.
      - name: Test the notification channel
        if: inputs.test_push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "ntfy: no NTFY_TOPIC set — nothing to test"
            exit 0
          fi
          fp=$(printf '%s' "$NTFY_TOPIC" | sha256sum | cut -c1-12)
          echo "ntfy: topic fingerprint $fp (len ${#NTFY_TOPIC})"
          echo "Compare with the subscribed device:"
          echo "  printf '%s' \"\$(cat ~/.config/ntfy-topic)\" | shasum -a 256 | cut -c1-12"
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' \
            -H "Title: Appleseed: canary test push" \
            -H "Priority: high" \
            -d "Test push from canary.yml at $(date -u +'%H:%M:%SZ'). If this did not arrive, the secret and the subscribed device are on different topics." \
            "https://ntfy.sh/$NTFY_TOPIC" 2>/dev/null || echo 000)
          echo "ntfy: HTTP $code"

      - name: Check last-run freshness, alert on staleness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Optional. Unset just means no push — the tracking issue and the
          # job failure still happen either way.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          STALE_FILE=$(mktemp)

          # Push to the same ntfy topic the laptop's sync-staleness monitor
          # uses. Until now this job's only output was a GitHub issue, which
          # is a fine durable marker but not something anyone sees promptly —
          # issue #3 sat unread through a real 9.5h dropped-trigger gap on
          # 2026-08-27. ntfy makes it a phone notification.
          # Says what happened to the push, because "nothing arrived" was
          # previously indistinguishable from "nothing was sent".
          #
          # The status alone is not enough: ntfy.sh creates topics on demand and
          # returns 200 for ANY name, so a stale or typo'd secret looks
          # perfectly healthy forever while every alert goes to a topic nobody
          # is subscribed to. The fingerprint is the first 12 hex of the topic's
          # sha256 — it reveals nothing, and it can be compared against the
          # subscribed device (`sha256sum ~/.config/ntfy-topic`'s contents) to
          # settle whether they are even the same topic.
          push() {
            if [ -z "${NTFY_TOPIC:-}" ]; then
              echo "ntfy: no NTFY_TOPIC set — no push sent"
              return 0
            fi
            local fp code
            fp=$(printf '%s' "$NTFY_TOPIC" | sha256sum | cut -c1-12)
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' \
              -H "Title: $1" \
              -H "Priority: $2" \
              -d "$3" \
              "https://ntfy.sh/$NTFY_TOPIC" 2>/dev/null || echo 000)
            echo "ntfy: HTTP $code to topic fingerprint $fp (len ${#NTFY_TOPIC})"
          }

          check() {
            local file="$1" max_age_min="$2"
            local created age_min
            created=$(gh api "repos/$REPO/actions/workflows/$file/runs?per_page=1" \
                        -q '.workflow_runs[0].created_at // empty' 2>/dev/null)
            if [ -z "$created" ]; then
              echo "- **$file**: could not determine last run time (API error or no runs)" >> "$STALE_FILE"
              return
            fi
            age_min=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 60 ))
            echo "$file: last run ${age_min}m ago (limit ${max_age_min}m)"
            if [ "$age_min" -gt "$max_age_min" ]; then
              echo "- **$file**: last run ${age_min} min ago (limit ${max_age_min}m), at $created" >> "$STALE_FILE"
            fi
          }

          # every ~30min in name, ~50-80min in observed practice; widened
          # 150->240 on 2026-08-27 after a genuine ~9.5h dropped-trigger gap
          # (no declared incident) tripped it twice in one day. Widened again
          # 240->360 on 2026-08-30 — kept tripping every 1-2 days on gaps in
          # the 250-320min range that always self-recovered before anyone
          # looked, so 240 was catching routine trigger jitter, not incidents
          check "fetch-bill-status.yml"   360
          # daily at 22:00 UTC
          check "sync-publications.yml"   1800
          # weekly, Sundays 15:00 UTC
          check "refresh-corpus.yml"      11520

          existing=$(gh issue list --repo "$REPO" --label canary-alert --state open --json number -q '.[0].number // empty')

          if [ -s "$STALE_FILE" ]; then
            {
              echo "One or more scheduled workflows have gone quiet — most likely a dropped or delayed GitHub Actions trigger ([check for an active incident](https://githubstatus.com)), not necessarily a bug in this repo."
              echo
              cat "$STALE_FILE"
              echo
              echo "_Checked $(date -u +'%Y-%m-%d %H:%M UTC')._"
            } > body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body-file body.md
            else
              gh issue create --repo "$REPO" --title "Scheduled workflow(s) went quiet" --label canary-alert --body-file body.md
            fi
            push "Appleseed: scheduled workflow quiet" high \
              "$(sed 's/[*]//g' "$STALE_FILE")"
            exit 1
          fi

          if [ -n "$existing" ]; then
            echo "All watched workflows are fresh again as of $(date -u +'%Y-%m-%d %H:%M UTC')." > body.md
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
            gh issue close "$existing" --repo "$REPO"
            push "Appleseed: workflows recovered" default \
              "All watched scheduled workflows are running again."
          fi
          echo "All watched workflows are fresh."

      # Deliberately a separate step: the check above exits 1 on staleness,
      # which would skip this, and a stale cron and an unfixed failure are
      # different faults that should not hide each other.
      - name: Re-alert on triage issues that are still open
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Quiet for the first day — triage has already alerted once, and
          # most things get fixed the same day without a second nag.
          ESCALATE_AFTER_H: "24"
          # Then at most once a day. This job runs hourly; re-pushing hourly
          # about a two-day-old fault is how an alert channel gets muted.
          REPEAT_EVERY_H: "24"
        run: |
          set -uo pipefail
          MARKER="<!-- canary-escalation -->"

          push() {
            if [ -z "${NTFY_TOPIC:-}" ]; then
              echo "ntfy: no NTFY_TOPIC set — no push sent"
              return 0
            fi
            fp=$(printf '%s' "$NTFY_TOPIC" | sha256sum | cut -c1-12)
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' \
              -H "Title: $1" \
              -H "Priority: high" \
              -H "Actions: view, Open issue, $3" \
              -d "$2" \
              "https://ntfy.sh/$NTFY_TOPIC" 2>/dev/null || echo 000)
            echo "ntfy: HTTP $code to topic fingerprint $fp (len ${#NTFY_TOPIC})"
          }

          now=$(date -u +%s)

          gh issue list --repo "$REPO" --label triage --state open \
            --json number,title,createdAt,url \
            -q '.[] | [.number, .createdAt, .url, .title] | @tsv' \
          | while IFS=$'\t' read -r num created url title; do
              [ -z "${num:-}" ] && continue
              age_h=$(( (now - $(date -d "$created" +%s)) / 3600 ))
              if [ "$age_h" -lt "$ESCALATE_AFTER_H" ]; then
                echo "#$num: ${age_h}h old, under the ${ESCALATE_AFTER_H}h threshold"
                continue
              fi

              # When did we last nag about this one? No marker means never,
              # so fall back to the issue's own age.
              last=$(gh api "repos/$REPO/issues/$num/comments" --paginate \
                       -q "[.[] | select(.body | contains(\"$MARKER\")) | .created_at] | last // empty" \
                     2>/dev/null)
              if [ -n "$last" ]; then
                since_h=$(( (now - $(date -d "$last" +%s)) / 3600 ))
              else
                since_h="$age_h"
              fi
              if [ "$since_h" -lt "$REPEAT_EVERY_H" ]; then
                echo "#$num: ${age_h}h old, last nagged ${since_h}h ago — holding"
                continue
              fi

              days=$(( age_h / 24 ))
              echo "#$num: ${age_h}h old — escalating"
              printf '%s\n%s\n' "$MARKER" \
                "Still open after ${days} day(s). The original alert fired once when this broke; this is the daily reminder that it has not been fixed or closed. Closing this issue stops the reminders." \
                | gh issue comment "$num" --repo "$REPO" --body-file - || true
              push "Appleseed: still broken after ${days}d — $title" \
                   "Triage issue #${num} has been open ${age_h}h. $url" "$url"
            done
