<!-- "Why Hawaiʻi's Tax System Is Unfair" — homepage code block (hitaxfairness.org).

<style>
.tfc-chart {
    --tfc-navy: #253551;
    --tfc-low: #d4541e;
    --tfc-ink: #253551;
    --tfc-muted: #4a5568;
    font-family: var(--body-font-font-family), sans-serif;
    color: var(--tfc-ink);
    background: #ffffff;
    border-radius: 8px;
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 56px 44px;
    box-sizing: border-box;
}

.tfc-chart-title {
    font-family: var(--heading-font-font-family), sans-serif;
    font-weight: 400;
    font-size: 2rem;
    line-height: 1.2;
    letter-spacing: 0;
    margin: 0 0 8px;
    color: var(--tfc-navy);
}

.tfc-chart-sub {
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--tfc-muted);
    margin: 0 0 32px;
}

.tfc-chart-rows {
    display: grid;
    gap: 22px;
}

.tfc-row {
    display: grid;
    grid-template-columns: 200px 1fr;
    align-items: center;
    column-gap: 24px;
}

.tfc-row-label strong {
    display: block;
    font-family: var(--heading-font-font-family), sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .04em;
    text-transform: uppercase;
}

.tfc-row-label span {
    display: block;
    font-size: .95rem;
    color: var(--tfc-muted);
    margin-top: 2px;
}

.tfc-row-track {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 44px;
}

.tfc-row-bar {
    flex: none;
    height: 100%;
    border-radius: 0 4px 4px 0;
    background: var(--tfc-navy);
}

.tfc-row--low .tfc-row-bar { background: var(--tfc-low); }

.tfc-row-value {
    font-family: var(--heading-font-font-family), sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    white-space: nowrap;
}

.tfc-row--low .tfc-row-value { color: #b3431a; }

.tfc-axis {
    display: grid;
    grid-template-columns: 200px 1fr;
    column-gap: 24px;
    margin-top: 10px;
}

.tfc-axis-scale {
    position: relative;
    height: 22px;
    border-top: 1px solid #c4c9d2;
    font-size: .85rem;
    color: var(--tfc-muted);
}

.tfc-axis-scale span {
    position: absolute;
    top: 4px;
    transform: translateX(-50%);
}

.tfc-axis-scale span:first-child { transform: none; }

.tfc-chart-caption {
    font-size: 1.1rem;
    line-height: 1.5;
    margin: 32px 0 24px;
    color: var(--tfc-ink);
}

.tfc-chart a.tfc-chart-btn {
    display: inline-block;
    text-decoration: none;
}

/* The Fluid Engine block holding this code sits in columns 8-20 of 26,
   off-centre, and its resize handles are fiddly. Span the full content
   width instead; .tfc-chart centres itself at 880px. The class is this
   block's Squarespace id, so re-check it if the block is ever recreated. */
@media (min-width: 768px) {
    .fe-block-yui_3_17_2_1_1770159740777_5942 { grid-column: 2 / 26 !important; }
}

@media (max-width: 767px) {
    .tfc-chart { padding: 28px 20px 28px; }
    .tfc-chart-title { font-size: 1.55rem; }
    .tfc-chart-sub { margin-bottom: 22px; }
    .tfc-row, .tfc-axis { grid-template-columns: 1fr; }
    .tfc-row-label { margin-bottom: 8px; }
    .tfc-row-track { height: 36px; }
    .tfc-row-value { font-size: 1.35rem; }
    .tfc-axis > :first-child { display: none; }
    .tfc-chart-caption { margin: 24px 0 20px; }
}
</style>

<div class="tfc-chart">

    <div class="tfc-axis" aria-hidden="true">

</div>
