<!-- Homepage "2027 Priorities" banner (hitaxfairness.org) - a Code Block near the top of the homepage.
     Paste everything below into that block. Links to /2027-priorities. Same palette as the
     rest of the site: navy #253551, logo blue #3c73b9; fonts from Site Styles. -->

<style>
.tfc-p27-banner {
    --tfc-navy: #253551;
    container-type: inline-size;
    width: 100%;
    font-family: var(--body-font-font-family), sans-serif;
}
.tfc-p27-banner *, .tfc-p27-banner *::before, .tfc-p27-banner *::after { box-sizing: border-box; }
.tfc-p27-banner a.tfc-p27-banner-link {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 28px;
    padding: 22px 28px;
    border-radius: 8px;
    background: var(--tfc-navy);
    color: #fff;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(37, 53, 81, .22);
    transition: transform .15s ease, box-shadow .15s ease;
}
.tfc-p27-banner a.tfc-p27-banner-link:hover,
.tfc-p27-banner a.tfc-p27-banner-link:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(37, 53, 81, .3);
}
.tfc-p27-banner-tag {
    flex: none;
    padding: 4px 11px;
    border-radius: 999px;
    background: #fff;
    color: var(--tfc-navy);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
}
.tfc-p27-banner-text { flex: 1 1 320px; min-width: 0; }
.tfc-p27-banner-text strong {
    display: block;
    font-family: var(--heading-font-font-family), sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.25;
}
.tfc-p27-banner-text span {
    display: block;
    margin-top: 4px;
    font-size: .98rem;
    line-height: 1.45;
    color: rgba(255, 255, 255, .85);
}
.tfc-p27-banner-cta {
    flex: none;
    font-weight: 700;
    white-space: nowrap;
    border-bottom: 2px solid rgba(255, 255, 255, .6);
    padding-bottom: 2px;
}
.tfc-p27-banner-cta::after { content: " \2192"; }
@container (max-width: 560px) {
    .tfc-p27-banner a.tfc-p27-banner-link { padding: 18px 20px; }
    .tfc-p27-banner-text { flex-basis: 100%; }
    .tfc-p27-banner-text strong { font-size: 1.15rem; }
}
</style>

<div class="tfc-p27-banner">
    <a class="tfc-p27-banner-link" href="/2027-priorities">
        <span class="tfc-p27-banner-tag">New</span>
        <span class="tfc-p27-banner-text">
            <strong>Our 2027 Priorities</strong>
            <span>Tax wealth like work, keep working families&rsquo; tax credits, and reform the conveyance tax to fund Hawaiian homes.</span>
        </span>
        <span class="tfc-p27-banner-cta">See the priorities</span>
    </a>
</div>
